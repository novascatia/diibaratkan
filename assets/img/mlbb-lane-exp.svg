<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="600" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1326"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0" y1="0" x2="600" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE89E"/>
      <stop offset="100%" stop-color="#B8862D"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bg1)"/>
  <!-- Celestial Compass Rings -->
  <circle cx="300" cy="180" r="150" stroke="url(#gold1)" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="12 8"/>
  <circle cx="300" cy="180" r="110" stroke="#00D4FF" stroke-width="2" stroke-opacity="0.4"/>
  <!-- EXP Lane Bastion Shield / Turret Spire -->
  <polygon points="300,48 378,104 356,256 300,312 244,256 222,104" fill="#101C38" stroke="url(#gold1)" stroke-width="4"/>
  <polygon points="300,78 346,122 332,238 300,276 268,238 254,122" fill="#00D4FF" fill-opacity="0.18" stroke="#00D4FF" stroke-width="2"/>
  <polygon points="300,115 325,180 300,245 275,180" fill="url(#gold1)"/>
  <circle cx="300" cy="180" r="14" fill="#7AF7FF"/>
</svg>