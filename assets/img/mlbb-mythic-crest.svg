  <!-- Inner Wing Filigree -->
  <polygon points="120,30 148,66 196,54 174,102 204,126 164,154 172,186 120,168 68,186 76,154 36,126 66,102 44,54 92,66"
           fill="#111C35" stroke="url(#goldGrad)" stroke-width="3"/>
  <!-- Crown Spires -->
  <polygon points="78,56 96,20 120,44 144,20 162,56 120,72" fill="url(#goldGrad)"/>
  <!-- Central Mythic Core Gem -->
  <polygon points="120,56 162,116 120,192 78,116" fill="url(#cyanGem)" stroke="url(#goldGrad)" stroke-width="5"/>
  <polygon points="120,72 146,116 120,172 94,116" fill="#A6FAFF" opacity="0.35"/>
  <!-- Center Star Glint -->
