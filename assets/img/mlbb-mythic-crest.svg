<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="45%" stop-color="#E5B85B"/>
      <stop offset="100%" stop-color="#9A6B1F"/>
    </linearGradient>
    <linearGradient id="cyanGem" x1="80" y1="60" x2="160" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7AF7FF"/>
      <stop offset="50%" stop-color="#00C8FF"/>
