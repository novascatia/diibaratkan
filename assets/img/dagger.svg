<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 60" fill="none">
  <!-- Joker's Rebel Knife / Dagger Selector -->
  <g transform="rotate(-4 90 30)">
    <!-- Shadow -->
    <polygon points="8,34 112,14 112,48" fill="#070709"/>
    <!-- Blade -->
    <polygon points="4,30 108,10 102,30 108,44" fill="#F7F5F0" stroke="#070709" stroke-width="4"/>
    <polygon points="12,30 102,18 98,30" fill="#D80018"/>
    <!-- Crossguard -->
    <polygon points="104,4 120,8 116,54 100,50" fill="#070709" stroke="#F7F5F0" stroke-width="3"/>
    <!-- Hilt -->
    <polygon points="118,20 162,18 160,38 116,40" fill="#D80018" stroke="#070709" stroke-width="4"/>
    <!-- Pommel Ring -->
    <circle cx="166" cy="28" r="9" fill="#070709" stroke="#F7F5F0" stroke-width="4"/>
    <circle cx="166" cy="28" r="3" fill="#D80018"/>
  </g>
</svg>