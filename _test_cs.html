<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css" />
</head>
<body style="background:#0d0d0d;">
  <div class="page-transition-stage is-active is-closing">
    <div class="transition-banner">
      <div id="check">CHECK TEXT</div>
    </div>
  </div>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const banner = document.querySelector('.transition-banner');
      const cs = window.getComputedStyle(banner);
      console.log('COMPUTED_OPACITY=' + cs.opacity + ' DISPLAY=' + cs.display + ' ZINDEX=' + cs.zIndex);
    });
  </script>
</body>
</html>
