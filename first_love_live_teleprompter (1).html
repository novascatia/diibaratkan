<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Love - Auto Chord Teleprompter</title>
    <style>
        body {
            background-color: #121212;
            color: #e5e5e5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        #app-container {
            width: 90%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #section-badge {
            background-color: #262626;
            color: #a3a3a3;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            align-self: flex-start;
        }

        #chord-display {
            font-family: "Fira Code", "Courier New", monospace;
            font-size: 1.5rem;
            line-height: 1.8;
            white-space: pre-wrap;
            margin: 0;
        }

        .chord {
            color: #fbbf24;
            font-weight: 700;
        }

        #status-bar {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
            color: #737373;
        }

        #mic-btn {
            background-color: #333;
            color: #e5e5e5;
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        #mic-btn.active {
            background-color: #dc2626;
            color: white;
            border-color: #ef4444;
            animation: pulse 2s infinite;
        }

        #live-transcript {
            font-style: italic;
            opacity: 0.7;
            max-width: 50%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="section-badge">Loading...</div>
        <pre id="chord-display"></pre>
    </div>

    <div id="status-bar">
        <div>
            <button id="mic-btn">Start Auto-Listen</button>
            <span style="margin-left: 15px;">Slide <span id="slide-count">1/1</span></span>
        </div>
        <div id="live-transcript"></div>
        <div>Nav: Click / Space / Arrows</div>
    </div>

    <script>
        const songData = [
            {
                section: "Intro",
                content: "<span class='chord'>G</span>           <span class='chord'>Cm</span>",
                triggerPhrase: ""
            },
            {
                section: "Verse 1",
                content: "<span class='chord'>G</span>           <span class='chord'>Am</span>\nEvery one can see\n<span class='chord'>D</span>              <span class='chord'>G</span>\nThere's a change in me\n<span class='chord'>Em</span>              <span class='chord'>Am</span>\nThey all say I'm not the same\n<span class='chord'>A</span>               <span class='chord'>D</span>\nKid I used to be\n\n<span class='chord'>G</span>               <span class='chord'>Am</span>\nDon't go out and play\n<span class='chord'>D</span>              <span class='chord'>G</span>\nI just dream all day\n<span class='chord'>Em</span>                  <span class='chord'>Am</span>\nThey don't know what's wrong with me\n<span class='chord'>A</span>               <span class='chord'>D</span>\nAnd I'm too shy to say",
                triggerPhrase: "shy to say"
            },
            {
                section: "Refrain",
                content: "<span class='chord'>G</span>\nIt's my first love\n<span class='chord'>B</span>\nWhat I'm dreamin' of\n<span class='chord'>Em</span>\nWhen I go to bed\n<span class='chord'>Dm</span>      <span class='chord'>G</span>       <span class='chord'>C</span>\nWhen I lay my head upon my pillow\n<span class='chord'>Am</span>      <span class='chord'>D</span>\nDon't know what to do\n\n<span class='chord'>G</span>\nMy first love\n<span class='chord'>B</span>\nThinks that I'm too young\n<span class='chord'>Em</span>\nHe doesn't even know\n<span class='chord'>Dm</span>      <span class='chord'>G</span>\nWish that I could show him\n<span class='chord'>C</span>\nWhat I'm feelin'\n<span class='chord'>Am</span>      <span class='chord'>D</span>       <span class='chord'>G</span>\n'cause I'm feelin' my first love",
                triggerPhrase: "feeling my first love"
            },
            {
                section: "Instrumental",
                content: "<span class='chord'>G</span>  <span class='chord'>Cm</span>",
                triggerPhrase: ""
            },
            {
                section: "Verse 2",
                content: "<span class='chord'>G</span>             <span class='chord'>Am</span>\nMirror on the wall\n<span class='chord'>D</span>              <span class='chord'>G</span>\nDoes he care at all\n<span class='chord'>Em</span>               <span class='chord'>Am</span>\nWill he ever notice me\n<span class='chord'>A</span>               <span class='chord'>D</span>\nCould he ever fall\n\n<span class='chord'>G</span>             <span class='chord'>Am</span>\nTell me teddy bear\n<span class='chord'>D</span>              <span class='chord'>G</span>\nWhy love is so unfair\n<span class='chord'>Em</span>               <span class='chord'>Am</span>\nWill I ever find a way\n<span class='chord'>A</span>               <span class='chord'>D</span>\nAn answer to my prayer",
                triggerPhrase: "answer to my prayer"
            },
            {
                section: "Refrain",
                content: "<span class='chord'>G</span>\nFor my first love\n<span class='chord'>B</span>\nWhat I'm dreamin' of\n<span class='chord'>Em</span>\nWhen I go to bed\n<span class='chord'>Dm</span>      <span class='chord'>G</span>       <span class='chord'>C</span>\nWhen I lay my head upon my pillow\n<span class='chord'>Am</span>      <span class='chord'>D</span>\nDon't know what to do\n\n<span class='chord'>G</span>\nMy first love\n<span class='chord'>B</span>\nThinks that I'm too young\n<span class='chord'>Em</span>\nHe doesn't even know\n<span class='chord'>Dm</span>      <span class='chord'>G</span>\nWish that I could show him what I'm\n<span class='chord'>C</span>\nfeelin'\n<span class='chord'>Am</span>      <span class='chord'>D</span>       <span class='chord'>G</span>\n'cause I'm feelin' my first love",
                triggerPhrase: "feeling my first love"
            },
            {
                section: "Outro",
                content: "<span class='chord'>Cm</span>  <span class='chord'>G</span>\nMy first love",
                triggerPhrase: ""
            }
        ];

        let currentIndex = 0;
        let isListening = false;
        let recognition = null;

        const badgeEl = document.getElementById('section-badge');
        const chordEl = document.getElementById('chord-display');
        const countEl = document.getElementById('slide-count');
        const micBtn = document.getElementById('mic-btn');
        const transcriptEl = document.getElementById('live-transcript');

        function renderSlide(index) {
            if (index < 0) index = 0;
            if (index >= songData.length) index = songData.length - 1;
            currentIndex = index;

            badgeEl.innerText = songData[currentIndex].section;
            chordEl.innerHTML = songData[currentIndex].content;
            countEl.innerText = (currentIndex + 1) + "/" + songData.length;
        }

        function nextSlide() {
            if (currentIndex < songData.length - 1) {
                renderSlide(currentIndex + 1);
            }
        }

        function prevSlide() {
            if (currentIndex > 0) {
                renderSlide(currentIndex - 1);
            }
        }

        // Keyboard & Click Navigation
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowRight') {
                e.preventDefault();
                nextSlide();
            } else if (e.code === 'ArrowLeft') {
                e.preventDefault();
                prevSlide();
            }
        });

        document.body.addEventListener('click', (e) => {
            if (e.target !== micBtn) {
                nextSlide();
            }
        });

        // Web Speech API Setup
        const speechApi = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (speechApi) {
            recognition = new speechApi();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                let currentTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    currentTranscript += event.results[i][0].transcript.toLowerCase();
                }
                
                transcriptEl.innerText = `Lirik terdengar: "${currentTranscript.trim()}"`;

                const trigger = songData[currentIndex].triggerPhrase.toLowerCase();
                
                if (trigger && currentTranscript.includes(trigger)) {
                    nextSlide();
                    
                    // Restart recognition to clear transcript buffer
                    recognition.stop();
                    setTimeout(() => {
                        if (isListening) recognition.start();
                    }, 400);
                }
            };

            recognition.onend = () => {
                if (isListening) recognition.start(); 
            };

            micBtn.addEventListener('click', () => {
                isListening = !isListening;
                if (isListening) {
                    recognition.start();
                    micBtn.classList.add('active');
                    micBtn.innerText = 'Listening...';
                } else {
                    recognition.stop();
                    micBtn.classList.remove('active');
                    micBtn.innerText = 'Start Auto-Listen';
                    transcriptEl.innerText = '';
                }
            });
        } else {
            micBtn.style.display = 'none';
            transcriptEl.innerText = 'Web Speech API tidak didukung di browser ini.';
        }

        // Initialize
        renderSlide(0);
    </script>
</body>
</html>
