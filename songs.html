<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>novascatia's setlist</title>
<style>
  body {
    background: #111;
    color: #eee;
    font-family: sans-serif;
    max-width: 500px;
    margin: 60px auto;
    padding: 0 20px 40px;
  }
  h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 32px; color: #fff; }
  h2 { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #555; margin: 28px 0 4px; }
  .song { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 10px 0; border-bottom: 1px solid #222; font-size: 0.95rem; }
  .song-title-box { display: flex; align-items: center; gap: 8px; }
  .song-title { color: #fff; }
  .song-artist { color: #888; text-align: right; }
  
  .status-badge {
    font-size: 0.65rem;
    padding: 2px 6px;
    border-radius: 3px;
    font-weight: bold;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .badge-now { background: #1db954; color: #000; }
  .badge-played { background: #222; color: #777; border: 1px solid #333; }
  
  .now-playing-item { border-bottom: 1px solid #333; padding: 12px 0; }
  .now-playing-item .song-title { color: #1db954; font-weight: bold; }
</style>
</head>
<body>

<h1>novascatia's song list 🎸</h1>
<div id="setlistcontent">
  <div class="song"><span class="song-title">Loading live setlist...</span></div>
</div>

<script>
const apiurl = "/api/setlist";

const defaultguitar = [
  "I'll be friends with you - arash buana",
  "Sudah - Ardhito Pramono",
  "First Love - Ardhito Pramono",
  "Falling Behind - Laufey",
  "Sunshine - The Panturas",
  "Walking back home - Vira Talisa"
];

const defaultkaraoke = [
  "Let you break my heart again - Laufey",
  "Promise - Laufey",
  "Bored - Laufey"
];

function parsesong(s) {
  const idx = s.indexOf(' - ');
  if (idx === -1) return { title: s, artist: "" };
  return {
    title: s.slice(0, idx),
    artist: s.slice(idx + 3)
  };
}

function rendersection(container, label, songlist, badgetype = null) {
  if (!songlist || songlist.length === 0) return;
  const h2 = document.createElement('h2');
  h2.textContent = label;
  container.appendChild(h2);

  songlist.forEach(s => {
    const parsed = parsesong(s);
    const div = document.createElement('div');
    
    let badgehtml = '';
    if (badgetype === 'now') {
      div.className = 'song now-playing-item';
      badgehtml = `<span class="status-badge badge-now">Now Playing</span>`;
    } else if (badgetype === 'played') {
      div.className = 'song';
      badgehtml = `<span class="status-badge badge-played">Played</span>`;
    } else {
      div.className = 'song';
    }

    div.innerHTML = `
      <div class="song-title-box">
        <span class="song-title">${parsed.title}</span>
        ${badgehtml}
      </div>
      <span class="song-artist">${parsed.artist}</span>
    `;
    container.appendChild(div);
  });
}

async function fetchsetlist() {
  try {
    const res = await fetch(apiurl);
    if (!res.ok) return;
    const store = await res.json();

    const states = store.states || {};
    const customguitar = store.guitar || defaultguitar;
    const customkaraoke = store.karaoke || defaultkaraoke;

    const nowplaying = [];
    const alreadyplayed = [];
    const guitarnormal = [];
    const karaokenormal = [];

    customguitar.forEach(s => {
      const st = states[s] || "normal";
      if (st === "now_playing") nowplaying.push(s);
      else if (st === "already_played") alreadyplayed.push(s);
      else guitarnormal.push(s);
    });

    customkaraoke.forEach(s => {
      const st = states[s] || "normal";
      if (st === "now_playing") nowplaying.push(s);
      else if (st === "already_played") alreadyplayed.push(s);
      else karaokenormal.push(s);
    });

    const container = document.getElementById('setlistcontent');
    container.innerHTML = '';

    rendersection(container, 'now playing', nowplaying, 'now');
    rendersection(container, 'already played', alreadyplayed, 'played');
    rendersection(container, 'played on guitar', guitarnormal);
    rendersection(container, 'played with instrumental', karaokenormal);
  } catch (err) {
    console.error("sync error:", err);
  }
}

fetchsetlist();
setInterval(fetchsetlist, 4000);
</script>

</body>
</html>
