<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Music Status</title>
    <style>
        body { font-family: sans-serif; background: #0f0f0f; color: #fff; padding: 2rem; max-width: 600px; margin: auto; }
        .card { background: #1a1a1a; padding: 1.5rem; border-radius: 8px; margin-bottom: 1rem; border-left: 4px solid #1db954; }
        ul { padding-left: 20px; color: #aaa; }
    </style>
</head>
<body>
    <h1>Live Now Playing</h1>
    
    <div class="card">
        <h3>🎵 Now Playing</h3>
        <p id="currentSong">Loading...</p>
    </div>

    <div>
        <h3>📜 Already Played</h3>
        <ul id="historyList">
            <li>Loading history...</li>
        </ul>
    </div>

    <script>
        const BIN_URL_READ = "https://api.jsonbin.io/v3/b/YOUR_BIN_ID/latest";

        async function fetchSongState() {
            try {
                let res = await fetch(BIN_URL_READ);
                let json = await res.json();
                let data = json.record;

                // Update Now Playing
                document.getElementById("currentSong").innerText = data.nowPlaying || "Nothing playing";

                // Update History List
                let historyList = document.getElementById("historyList");
                historyList.innerHTML = "";
                if (data.alreadyPlayed && data.alreadyPlayed.length > 0) {
                    data.alreadyPlayed.forEach(song => {
                        let li = document.createElement("li");
                        li.innerText = song;
                        historyList.appendChild(li);
                    });
                } else {
                    historyList.innerHTML = "<li>No songs played yet.</li>";
                }
            } catch (err) {
                console.error("Failed to sync song state", err);
            }
        }

        // Fetch immediately, then poll every 4 seconds
        fetchSongState();
        setInterval(fetchSongState, 4000);
    </script>
</body>
</html>
