<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>novascotia's setlist</title>
<style>
  body {
    background: #111;
    color: #eee;
    font-family: sans-serif;
    max-width: 500px;
    margin: 60px auto;
    padding: 0 20px 40px;
  }
  h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 32px; color: #fff; }
  h2 { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #555; margin: 28px 0 4px; }
  .song { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid #222; font-size: 0.95rem; }
  .song-title { color: #fff; }
  .song-artist { color: #888; text-align: right; }
</style>
</head>
<body>

<h1>novascotia's song list 🎸</h1>

<script>
// ── GUITAR ────────────────────────────────────
const guitar = [
  "I'll be friends with you - arash buana",
  "Sudah - Ardhito Pramono",
  "First Love - Ardhito Pramono",
  "Falling Behind - Laufey",
  "Sunshine - The Panturas",
  "Walking back home - Vira Talisa",
];

// ── KARAOKE ───────────────────────────────────
const karaoke = [
  "Let you break my heart again - Laufey",
  "Promise - Laufey",
  "Bored - Laufey",
];
// ─────────────────────────────────────────────

function renderSection(label, songs) {
  const h2 = document.createElement('h2');
  h2.textContent = label;
  document.body.appendChild(h2);

  songs.forEach(s => {
    const idx = s.indexOf(' - ');
    const title = s.slice(0, idx);
    const artist = s.slice(idx + 3);
    const div = document.createElement('div');
    div.className = 'song';
    div.innerHTML = `<span class="song-title">${title}</span><span class="song-artist">${artist}</span>`;
    document.body.appendChild(div);
  });
}

renderSection('played on guitar', guitar);
renderSection('played with instrumental', karaoke);
</script>

</body>
</html>
